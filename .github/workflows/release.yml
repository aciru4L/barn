name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  GOOSE_VERSION: v2026.3

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          built="$(sed -n 's/^let VERSION = "\(.*\)";$/\1/p' barn.goose)"
          if [ "$built" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match VERSION \"$built\" in barn.goose"
              exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for $version"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive: tar.gz
          - os: macos-15-intel
            platform: macos-x64
            archive: tar.gz
          - os: macos-latest
            platform: macos-arm64
            archive: tar.gz
          - os: windows-latest
            platform: windows-x64
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PACKAGE: barn-v${{ needs.check.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Goose
        run: |
          name="goose-$GOOSE_VERSION-${{ matrix.platform }}"
          curl -fsSL -o "$RUNNER_TEMP/goose.${{ matrix.archive }}" \
            "https://github.com/aardappel/goose/releases/download/$GOOSE_VERSION/$name.${{ matrix.archive }}"
          cd "$RUNNER_TEMP"
          if [ "${{ matrix.archive }}" = zip ]; then unzip -q goose.zip; else tar xzf goose.tar.gz; fi
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
          echo "GOOSE_HOME=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Build
        run: |
          executable=barn
          [ "${{ matrix.archive }}" = zip ] && executable=barn.exe
          mkdir "$PACKAGE"
          goose build barn.goose -o "$PACKAGE/$executable"
          actual="$("$PACKAGE/$executable" version)"
          if [ "$actual" != "barn ${{ needs.check.outputs.version }}" ]; then
              echo "::error::built executable reports '$actual'"
              exit 1
          fi

      - name: Package
        run: |
          cp LICENSE README.md CHANGELOG.md "$PACKAGE/"
          cp "$GOOSE_HOME/LICENSE" "$PACKAGE/LICENSE-GOOSE"
          if [ "${{ matrix.archive }}" = zip ]; then
              7z a -bso0 "$PACKAGE.zip" "$PACKAGE"
          else
              tar czf "$PACKAGE.tar.gz" "$PACKAGE"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum barn-* > SHA256SUMS

      - name: Release notes
        run: |
          awk -v heading="## [${{ needs.check.outputs.version }}]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found
          ' CHANGELOG.md > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Barn ${{ needs.check.outputs.version }}" \
              --notes-file notes.md \
              --verify-tag
